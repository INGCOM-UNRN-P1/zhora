[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhora"
version = "0.1.0"
description = "Linter y auditor de seguridad en macros del preprocesador C (#define)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
]

[project.scripts]
zhora = "zhora.cli:app"

[project.entry-points."ripley.plugins"]
macro_security = "zhora.plugins.ripley_plugin:ZhoraPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
